
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>马克待办 Pro</title>

  <style>
    body {
    max-width: 900px;
    margin: 60px auto;
    background: #222;
    color: white;
}
    .app {
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f3f4f6;
      padding: 40px 20px;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .input-area {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    #todoInput {
      flex: 1;
      min-width: 150px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #4338ca;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 15px;
      border-bottom: 1px solid #eee;
    }

    .todo-info {
      flex: 1;
      overflow-wrap: anywhere;
    }

    .todo-info small {
      display: block;
      color: #999;
      margin-top: 5px;
    }

    .completed {
      text-decoration: line-through;
      color: #999;
    }

    .delete-btn {
      background: #ef4444;
    }

    .delete-btn:hover {
      background: #dc2626;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 20px;
    }
  </style>
</head>

<body>


    <h1>我的任务清单</h1>
<h1>马克待办 - 暗黑主题</h1>

<div class="container">

  <h1>马克待办 Pro</h1>

  <div class="input-area">
    <input
            type="text"
            id="todoInput"
            placeholder="请输入待办事项..."
    >

    <input
            type="date"
            id="dateInput"
    >

    <button onclick="addTodo()">添加事项</button>
  </div>

  <ul id="todoList"></ul>

</div>

<script>
  // 保存所有待办事项
  let todos = [];

  // 获取页面元素
  const input = document.getElementById("todoInput");
  const dateInput = document.getElementById("dateInput");
  const todoList = document.getElementById("todoList");


  // 添加待办事项
  function addTodo() {
    const text = input.value.trim();

    if (!text) {
      alert("请输入待办事项！");
      return;
    }

    // 修复 Bug：正确保存用户输入的事项名称
    todos.push({
      id: Date.now(),
      text,
      due: dateInput.value,
      completed: false
    });

    input.value = "";
    renderTodos();
  }


  // 渲染待办事项
  function renderTodos() {
    todoList.innerHTML = "";

    if (todos.length === 0) {
      todoList.innerHTML = '<li class="empty">暂无待办事项</li>';
      return;
    }

    todos.forEach(todo => {
      const li = document.createElement("li");

      const info = document.createElement("div");
      info.className = "todo-info";

      const title = document.createElement("span");
      title.textContent = todo.text;

      if (todo.completed) {
        title.classList.add("completed");
      }

      const date = document.createElement("small");
      date.textContent = todo.due
              ? "截止日期：" + todo.due
              : "未设置截止日期";

      info.appendChild(title);
      info.appendChild(date);

      const completeBtn = document.createElement("button");
      completeBtn.textContent = todo.completed ? "取消完成" : "完成";
      completeBtn.onclick = () => toggleTodo(todo.id);

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "删除";
      deleteBtn.className = "delete-btn";
      deleteBtn.onclick = () => deleteTodo(todo.id);

      li.appendChild(info);
      li.appendChild(completeBtn);
      li.appendChild(deleteBtn);

      todoList.appendChild(li);
    });
  }


  // 切换完成状态
  function toggleTodo(id) {
    const todo = todos.find(item => item.id === id);

    if (todo) {
      todo.completed = !todo.completed;
      renderTodos();
    }
  }


  // 删除待办事项
  function deleteTodo(id) {
    todos = todos.filter(item => item.id !== id);
    renderTodos();
  }


  // 初始化页面
  renderTodos();

</script>

</body>
</html>
